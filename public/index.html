<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US Stock Calendar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local earnings calendar</p>
          <h1>US Stock Calendar</h1>
          <p id="status-line" class="status-line">Loading earnings calendar...</p>
        </div>
        <div class="topbar-actions">
          <button id="refresh-button" class="refresh-button" type="button">Refresh</button>
          <div class="time-legend" aria-label="Timing legend">
            <span><strong>Pre</strong> pre market</span>
            <span><strong>After</strong> after market</span>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Calendar controls">
        <div class="segmented" role="group" aria-label="View">
          <button type="button" data-view="day">Daily</button>
          <button type="button" data-view="week">Weekly</button>
          <button type="button" data-view="month">Monthly</button>
        </div>

        <div class="filters">
          <div class="filter-group" aria-label="Market-cap filters">
            <span class="filter-label">Market cap</span>
            <label><input type="checkbox" data-tier="mega" checked> Mega ($200B+)</label>
            <label><input type="checkbox" data-tier="large"> Large ($10B-$200B)</label>
            <label><input type="checkbox" data-tier="small"> Small (&lt;$10B)</label>
          </div>

          <label class="select-filter">
            <span class="filter-label">Sector</span>
            <select id="sector-filter">
              <option value="">All sectors</option>
            </select>
          </label>
        </div>
      </section>

      <section class="calendar-panel" aria-live="polite">
        <div id="calendar-output"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
